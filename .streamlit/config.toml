# The app is a full-screen globe on a dark background. The background
# colour matches ui/theme.py, so nothing flashes white while it loads.

[theme]
base = "dark"
primaryColor = "#7FB2FF"
backgroundColor = "#03050A"
secondaryBackgroundColor = "#0E1524"
textColor = "#E8ECF4"
font = "sans serif"
# No gap around the globe. These must be quoted strings.
paddingTop = "0"
paddingBottom = "0"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
