# Visual direction from the project brief §8:
# calm, clear, welcoming, credible. Light neutral background,
# one restrained accent color, dark readable text.

[theme]
base = "light"
primaryColor = "#2E5EAA"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
