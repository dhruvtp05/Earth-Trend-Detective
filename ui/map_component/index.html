<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map of the selected study region</title>
<link rel="stylesheet" href="leaflet.css">
<style>
  :root {
    --bar-bg: #FFFFFF; --bar-ink: #1A1A1A; --bar-line: #D9DDE4;
    --ctl-bg: #F3F5F8; --ctl-line: #C3C9D3; --focus: #2E5EAA;
  }
  body.dark {
    --bar-bg: #161A22; --bar-ink: #E8EBF0; --bar-line: #2C3340;
    --ctl-bg: #232936; --ctl-line: #3A4352; --focus: #9CC3FF;
  }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    font-family: "Source Sans Pro", "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; color: var(--bar-ink);
    border: 1px solid var(--bar-line); border-radius: 14px; box-sizing: border-box;
    background: var(--bar-bg);
  }
  #toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 0.9rem;
    padding: 0.55rem 0.75rem; background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-line);
  }
  #toolbar label { display: inline-flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
  select, button, input { font: inherit; color: inherit; }
  select, #toolbar button {
    padding: 0.28rem 0.6rem; border-radius: 8px; cursor: pointer;
    background: var(--ctl-bg); border: 1px solid var(--ctl-line);
  }
  #toolbar button:hover, select:hover { border-color: var(--focus); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  input[type="range"] { width: 90px; accent-color: var(--focus); }
  input[type="checkbox"] { accent-color: var(--focus); width: 1rem; height: 1rem; }
  #map { flex: 1; min-height: 0; background: #DDE3EA; }
  body.dark #map { background: #0E1116; }
  #status {
    padding: 0.35rem 0.75rem; font-size: 13px; background: var(--bar-bg);
    border-top: 1px solid var(--bar-line);
  }
  .leaflet-container { font: inherit; }
  .region-name {
    font-weight: 600; font-size: 13px; color: #1A1A1A; background: rgba(255, 255, 255, 0.95);
    border: 2px solid currentColor; border-radius: 8px; padding: 0.15rem 0.5rem; box-shadow: none;
  }
  .region-name::before { display: none; }
</style>
</head>
<body>
<div id="toolbar" role="group" aria-label="Map tools">
  <label>Map style
    <select id="style">
      <option value="map">Map</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="satellite">Satellite</option>
    </select>
  </label>
  <button id="fit" type="button">Fit region</button>
  <label><input id="other" type="checkbox" checked> Show other region</label>
  <label>Shading <input id="shade" type="range" min="0" max="60" step="5" value="25" aria-label="Region shading strength"></label>
</div>
<div id="map" aria-label="Map showing the selected study region. The same boundaries are given as text in the data panel."></div>
<div id="status" role="status" aria-live="polite"></div>

<script src="leaflet.js"></script>
<script>
(function () {
  "use strict";

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }

  // Label-free base maps that need no API key. "Map" has detail to zoom
  // level 8 only, so closer views of it are enlarged.
  var ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
  var CREDIT = "Tiles &copy; Esri and its data providers";
  var MAX_ZOOM = 12;
  var STYLES = {
    map: { url: ESRI + "World_Physical_Map/MapServer/tile/{z}/{y}/{x}", options: { attribution: CREDIT + ", US National Park Service", maxNativeZoom: 8, maxZoom: MAX_ZOOM } },
    light: { url: ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", options: { attribution: CREDIT, maxZoom: MAX_ZOOM } },
    dark: { url: ESRI + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", options: { attribution: CREDIT, maxZoom: MAX_ZOOM } },
    satellite: { url: ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", options: { attribution: CREDIT, maxZoom: MAX_ZOOM } }
  };

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var styleSelect = document.getElementById("style");
  var otherToggle = document.getElementById("other");
  var shade = document.getElementById("shade");
  var status = document.getElementById("status");

  var map = null, tiles = null, regions = [], activeId = null, shapes = {};

  function bounds(r) { return L.latLngBounds([r.south, r.west], [r.north, r.east]); }
  function region(id) { return regions.filter(function (r) { return r.id === id; })[0]; }

  function setStyle(name) {
    if (tiles) map.removeLayer(tiles);
    tiles = L.tileLayer(STYLES[name].url, STYLES[name].options).addTo(map);
    tiles.bringToBack();
    document.body.classList.toggle("dark", name === "dark" || name === "satellite");
  }

  function fit(animated) {
    var target = region(activeId);
    if (!target) return;
    var options = { padding: [36, 36] };
    if (animated && !reduceMotion) {
      map.flyToBounds(bounds(target), Object.assign({ duration: 2.4 }, options));
    } else {
      map.fitBounds(bounds(target), options);
    }
  }

  function describe(r) {
    function lat(v) { return Math.abs(v) + "°" + (v >= 0 ? "N" : "S"); }
    function lng(v) { return Math.abs(v) + "°" + (v >= 0 ? "E" : "W"); }
    return r.label + ": " + lat(r.south) + " to " + lat(r.north) + ", " + lng(r.west) + " to " + lng(r.east) + ".";
  }

  // Draw every region; the active one is outlined strongly and labelled.
  function draw() {
    Object.keys(shapes).forEach(function (id) { map.removeLayer(shapes[id]); });
    shapes = {};
    var fill = Number(shade.value) / 100;

    regions.forEach(function (r) {
      var active = r.id === activeId;
      if (!active && !otherToggle.checked) return;
      var shape = L.rectangle(bounds(r), {
        color: r.color, weight: active ? 3 : 2, dashArray: active ? null : "6 6",
        fillColor: r.color, fillOpacity: active ? fill : fill / 2,
        interactive: !active, keyboard: !active
      }).addTo(map);
      shape.bindTooltip(active ? r.label : "Switch to " + r.label, {
        permanent: true, direction: "top", className: "region-name", opacity: 1
      });
      var element = shape.getTooltip() && shape.getTooltip().getElement();
      if (element) element.style.color = r.color;
      if (!active) {
        shape.on("click", function () {
          send("streamlit:setComponentValue", { value: { region: r.id, nonce: Date.now() }, dataType: "json" });
        });
      }
      shapes[r.id] = shape;
    });

    var current = region(activeId);
    status.textContent = current
      ? "Showing " + describe(current) + " Values are averaged over this whole box."
      : "";
  }

  function start(args) {
    regions = args.regions || [];
    activeId = args.active;
    var target = region(activeId) || regions[0];

    map = L.map("map", {
      zoomControl: false, scrollWheelZoom: false, zoomSnap: 0.25,
      minZoom: 2, maxZoom: MAX_ZOOM, worldCopyJump: true
    });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.control.scale({ position: "bottomleft" }).addTo(map);
    map.attributionControl.setPrefix(false);

    // The wheel scrolls the page until the map is clicked, then zooms.
    map.on("click", function () { map.scrollWheelZoom.enable(); });
    map.getContainer().addEventListener("mouseleave", function () { map.scrollWheelZoom.disable(); });

    setStyle(styleSelect.value);

    // Open close in on the region, then pull back to frame it. The intro
    // plays once per visit from the globe, not on every return to the page.
    var introSeen = null;
    try { introSeen = window.sessionStorage.getItem("etd_map_intro"); } catch (error) { /* storage blocked */ }
    var playIntro = target && args.intro_id && String(args.intro_id) !== introSeen && !reduceMotion;

    if (playIntro) {
      try { window.sessionStorage.setItem("etd_map_intro", String(args.intro_id)); } catch (error) { /* ignore */ }
      map.setView(bounds(target).getCenter(), 8);
      draw();
      window.setTimeout(function () { fit(true); }, 900);
    } else {
      if (target) map.fitBounds(bounds(target), { padding: [36, 36] });
      draw();
    }

    styleSelect.addEventListener("change", function () { setStyle(styleSelect.value); });
    document.getElementById("fit").addEventListener("click", function () { fit(true); });
    otherToggle.addEventListener("change", draw);
    shade.addEventListener("input", draw);
    window.addEventListener("resize", function () { map.invalidateSize(); });
  }

  var started = false;
  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    var args = event.data.args || {};
    send("streamlit:setFrameHeight", { height: args.height || 620 });

    if (!started) {
      started = true;
      requestAnimationFrame(function () {
        try {
          start(args);
        } catch (error) {
          status.textContent = "The map could not be shown. The region boundaries are listed in the data panel.";
        }
      });
      return;
    }
    // Later runs: move to the newly selected region.
    if (map && args.active && args.active !== activeId) {
      regions = args.regions || regions;
      activeId = args.active;
      draw();
      fit(true);
    }
  });

  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
